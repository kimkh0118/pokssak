# Render 블루프린트: backend 폴더의 Dockerfile로 서버 1개(무료). GitHub main에 올리면 자동 재배포.
# 비밀이 아닌 주소(value)는 여기서 정하고, 키 값(sync: false)은 Render 화면에서 직접 넣는다(저장소에 안 올라감).
services:
  - type: web
    name: pokssak-api
    runtime: docker
    plan: free
    region: virginia  # Turso DB(미국 동부)와 같은 곳: 조회마다 왕복하므로 가까워야 빠름
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JUSO_API_KEY
        sync: false
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
      - key: VWORLD_API_KEY
        sync: false
      - key: VWORLD_RELAY_URL
        value: https://pokssak.vercel.app/relay/vworld
      - key: VWORLD_RELAY_SECRET
        sync: false
      - key: VWORLD_DOMAIN
        value: https://pokssak.vercel.app
      - key: FRONTEND_ORIGIN
        value: https://pokssak.vercel.app
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
